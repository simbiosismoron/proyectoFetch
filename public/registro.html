
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta | Pampa</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/styles/register.css">
    <link rel="stylesheet" href="/styles/theme-dark.css">
</head>

<body>

    <header class="auth-header">
        <div class="container py-3 d-flex justify-content-between align-items-center">

            <a href="/" class="brand">
                pampa<span class="brand-dot">.</span>
            </a>

            <a href="/" class="back-link">
                ← Volver a la tienda
            </a>

        </div>
    </header>

    <main class="auth-main">

        <div class="auth-card">

            <p class="auth-eyebrow">Sumate a Pampa</p>

            <h1 class="auth-title">Crear cuenta</h1>

            <p class="auth-description">
                Registrate para realizar pedidos y consultar
                tu historial de compras.
            </p>

            <form id="formRegistro">

                <div class="mb-4">
                    <label for="nombre" class="form-label">
                        Nombre
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="nombre"
                        name="nombre"
                        placeholder="Ingresá tu nombre"
                        autocomplete="name"
                        required>
                </div>

                <div class="mb-4">
                    <label for="email" class="form-label">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="nombre@ejemplo.com"
                        autocomplete="email"
                        required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Mínimo 8 caracteres"
                        autocomplete="new-password"
                        minlength="8"
                        required>

                    <div class="form-text mt-2">
                        Utilizá una contraseña de al menos 8 caracteres.
                    </div>
                </div>

                <button type="submit" class="btn btn-pampa w-100">
                    Crear cuenta
                </button>

            </form>

            <p id="mensajeRegistro" class="mt-3 mb-0" aria-live="polite"></p>

            <a
                id="iniciar"
                class="btn btn-outline-success w-100 mt-3 d-none"
                href="login.html">
            </a>

            <div class="auth-divider"></div>

            <p class="login-text mb-0">
                ¿Ya tenés una cuenta?
                <a href="login.html" class="login-link">
                    Iniciá sesión
                </a>
            </p>

        </div>

    </main>

    <footer class="auth-footer">
        &copy; 2026 Pampa. Todos los derechos reservados.
    </footer>

    <script src="/js/registro.js"></script>

</body>
</html>
