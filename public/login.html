
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Pampa</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/styles/login.css">
</head>

<body>

    <header class="auth-header">
        <div class="container py-3 d-flex justify-content-between align-items-center">

            <a href="/" class="brand">
                pampa<span class="brand-dot">.</span>
            </a>

            <a href="/" class="back-link">
                ← Volver a la tienda
            </a>

        </div>
    </header>

    <main class="auth-main">

        <div class="auth-card">

            <p class="auth-eyebrow">Bienvenido a Pampa</p>

            <h1 class="auth-title">Iniciar sesión</h1>

            <p class="auth-description">
                Ingresá tus datos para acceder a tu cuenta
                y continuar con tus pedidos.
            </p>

            <form id="formLogin">

                <div class="mb-4">
                    <label for="email" class="form-label">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="nombre@ejemplo.com"
                        autocomplete="email"
                        required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Ingresá tu contraseña"
                        autocomplete="current-password"
                        required>
                </div>

                <button type="submit" class="btn btn-pampa w-100">
                    Iniciar sesión
                </button>

            </form>

            <p id="mensajeLogin" class="mt-3 mb-0" aria-live="polite"></p>

            <div class="auth-divider"></div>

            <p class="register-text mb-0">
                ¿Todavía no tenés una cuenta?
                <a href="registro.html" class="register-link">
                    Registrate
                </a>
            </p>

            <button
                type="button"
                onclick="cerrarSesion()"
                class="btn btn-outline-secondary logout-button w-100 mt-4">
                Cerrar sesión
            </button>

        </div>

    </main>

    <footer class="auth-footer">
        &copy; 2026 Pampa. Todos los derechos reservados.
    </footer>

    <script src="js/login.js"></script>

</body>
</html>
