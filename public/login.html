<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - Pampa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

    <main class="container mt-5">

        <div class="row justify-content-center">
            <div class="col-md-5">

                <h2 class="mb-4">Iniciar sesión</h2>

                <form id="formLogin">

                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Iniciar sesión
                    </button>

                </form>

                <p id="mensajeLogin" class="mt-3"></p>

                <p class="mt-3">
                    ¿No tenés cuenta?
                    <a href="registro.html">Registrate</a>
                </p>

                <button onclick="cerrarSesion()" class="btn btn-secondary w-100 mt-3">
                    Cerrar sesión
                </button>

            </div>
        </div>

    </main>

    <script src="js/login.js"></script>

</body>
</html>
